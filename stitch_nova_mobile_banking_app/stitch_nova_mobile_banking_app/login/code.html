px-6 flex items-center justify-between text-on-surface select-none"><span class="font-label-md text-label-md font-semibold tracking-tight">9:41</span><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[20px]">battery_full</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-11 pb-safe bg-surface"><div class="flex flex-col w-full px-space-md pb-space-lg select-none">
<!-- Brand & Mascot Delight Area -->
<div class="flex flex-col items-center pt-space-md pb-space-lg text-center relative">
<!-- Soft Ambient Glow behind brand mark -->
<div class="absolute top-2 w-32 h-32 bg-secondary-container/20 rounded-full blur-2xl pointer-events-none -z-10"></div>
<!-- Logo Container with micro-elevation and delight bounce -->
<div class="relative group cursor-pointer" id="brandLogoBox">
<div class="w-16 h-16 rounded-xl bg-surface-container-lowest p-2 shadow-md flex items-center justify-center transition-transform active:scale-95 duration-200">
<img alt="Nova Bank Logo" class="w-full h-full object-contain rounded-lg pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1X45AFWQsGUaw3g_SXdrw5y6XYton5F4s6FebEo5EwM4P8H9n4zh0SuzyHf4R6XL0wjHqZWzHKkew029EplQizx60PT4Jq-lnKnmt6AtP6DAzZvAU9oTIduPl1-zZSdqDrB7XACHABU778WUOmmYT77A2SNV2W9h3110tE513YitF6txyAN5Og5ECMtzF9xJZF_0x8JojI3ZgGbM3wUxj_oXSYuOXZ3235O0Xgw_nUZ4tEHHVsAGPDwWaVC"/>
</div>
<!-- Subtle Pulse Ping for Bank Readiness -->
<span class="absolute -top-1 -right-1 flex h-3.5 w-3.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-secondary"></span>
</span>
</div>
<!-- Title & Tagline -->
<h1 class="mt-space-md font-headline-md text-headline-md text-primary-container tracking-tight">
      Nova Bank
    </h1>
<p class="mt-1 font-body-sm text-body-sm text-on-surface-variant">
      Banking, made simple.
    </p>
</div>
<!-- Interactive Login Form Card (Surface contrast without explicit borders) -->
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
<!-- Dynamic Security Status Pill -->
<div class="flex items-center justify-between px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-secondary">verified_user</span>
<span class="font-label-sm text-label-sm tracking-wide uppercase font-semibold">Secure Core v4.2</span>
</div>
<span class="inline-flex items-center gap-1 font-label-sm text-label-sm text-secondary font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
        Encrypted
      </span>
</div>
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field Container -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant font-medium px-1" for="emailInput">
          Email address
        </label>
<div class="relative flex items-center bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-sm rounded-xl transition-all duration-200">
<div class="w-12 h-13 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-13 pr-4 bg-transparent outline-none font-body-md text-body-md text-on-surface placeholder:text-outline-variant" id="emailInput" name="email" placeholder="alex.morgan@example.com" required="" type="email" value="alex.morgan@example.com"/>
</div>
</div>
<!-- Password Field Container -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant font-medium px-1" for="passwordInput">
          Password
        </label>
<div class="relative flex items-center bg-surface-container-low focus-within:bg-surface-container-lowest focus-within:shadow-sm rounded-xl transition-all duration-200">
<div class="w-12 h-13 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-13 bg-transparent outline-none font-body-md text-body-md text-on-surface tracking-wider placeholder:tracking-normal placeholder:text-outline-variant" id="passwordInput" name="password" placeholder="••••••••••••" required="" type="password" value="ValidPasscode2025"/>
<button aria-label="Toggle password visibility" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-transform mr-1" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon">visibility</span>
</button>
</div>
<!-- Forgot Password Action -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container active:opacity-75 transition-colors min-h-[32px] flex items-center" href="#forgot">
            Forgot password?
          </a>
</div>
</div>
<!-- Primary Action Button: Log In -->
<button class="w-full h-[52px] mt-1 bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg shadow-sm active:bg-on-tertiary-container flex items-center justify-center gap-2 transition-all duration-150 transform active:scale-[0.99] cursor-pointer" id="loginSubmitBtn" type="submit">
<span id="loginBtnText">Log In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Biometric Option Separator -->
<div class="relative flex items-center justify-center my-0.5">
<div class="w-full h-[1px] bg-surface-container"></div>
<span class="absolute px-3 bg-surface-container-lowest font-label-sm text-label-sm text-outline">or authenticate with</span>
</div>
<!-- Biometric Secondary Action: Face ID Button -->
<button class="w-full h-[52px] bg-surface-container-low active:bg-surface-container text-primary-container rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-3 transition-colors duration-150 active:scale-[0.99] cursor-pointer" id="faceIdBtn" type="button">
<!-- Apple Face ID Svg Silhouette -->
<svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M7 3H5a2 2 0 0 0-2 2v2"></path>
<path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
<path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
<path d="M3 17v2a2 2 0 0 0 2 2h2"></path>
<circle cx="9" cy="9" fill="currentColor" r="1"></circle>
<circle cx="15" cy="9" fill="currentColor" r="1"></circle>
<path d="M10 13c.5.5 1.5 1 2 1s1.5-.5 2-1"></path>
<path d="M12 11v2"></path>
</svg>
<span>Log in with Face ID</span>
</button>
</form>
</div>
<!-- Micro Feedback Banner Area (Hidden by default, triggered on feedback) -->
<div class="hidden mt-space-sm px-4 py-3 rounded-xl bg-secondary-container text-on-secondary-container shadow-sm flex items-center gap-2.5 transition-all" id="statusToast">
<span class="material-symbols-outlined text-[20px] text-secondary">check_circle</span>
<span class="font-body-sm text-body-sm font-medium" id="statusToastMsg">Biometric match confirmed. Preparing feed...</span>
</div>
<!-- Security Reassurance Footnote -->
<div class="flex flex-col items-center gap-space-sm pt-space-lg text-center">
<div class="inline-flex items-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px] text-secondary">lock</span>
<span>Protected with 256-bit AES encryption</span>
</div>
<!-- Sign-up Redirect Prompt -->
<div class="flex items-center justify-center gap-1.5 text-on-surface font-body-sm text-body-sm min-h-[44px]">
<span class="text-on-surface-variant">New here?</span>
<a class="text-secondary font-label-md text-label-md hover:underline active:opacity-75" href="#register">
        Create an account
      </a>
</div>
</div>
</div>
<script>
  // Password Visibility Toggle
  const passwordInput = document.getElementById('passwordInput');
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const toggleIcon = document.getElementById('toggleIcon');
  const toast = document.getElementById('statusToast');
  const toastMsg = document.getElementById('statusToastMsg');
  const loginSubmitBtn = document.getElementById('loginSubmitBtn');
  const loginBtnText = document.getElementById('loginBtnText');
  const faceIdBtn = document.getElementById('faceIdBtn');

  if (toggleBtn && passwordInput && toggleIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });
  }

  // Delightful login simulation with tactile feedback
  function handleLogin() {
    loginSubmitBtn.disabled = true;
    loginBtnText.textContent = 'Verifying credentials...';
    
    setTimeout(() => {
      showToast('Welcome back, Alex! Redirecting...', false);
      loginBtnText.textContent = 'Redirecting...';
      loginSubmitBtn.classList.replace('bg-primary-container', 'bg-secondary');
    }, 900);
  }

  // Face ID mock trigger
  if (faceIdBtn) {
    faceIdBtn.addEventListener('click', () => {
      faceIdBtn.classList.add('opacity-70');
      showToast('Scanning Face ID sensor...', false);
      setTimeout(() => {
        faceIdBtn.classList.remove('opacity-70');
        showToast('Face ID verified. Access granted!', false);
      }, 1000);
    });
  }

  function showToast(message, isError) {
    if (!toast || !toastMsg) return;
    toastMsg.textContent = message;
    toast.classList.remove('hidden');
    if (isError) {
      toast.classList.replace('bg-secondary-container', 'bg-error-container');
      toast.classList.replace('text-on-secondary-container', 'text-on-error-container');
    } else {
      toast.classList.replace('bg-error-container', 'bg-secondary-container');
      toast.classList.replace('text-on-error-container', 'text-on-secondary-container');
    }
  }
</script><div class="w-full flex justify-center py-3"><div class="w-32 h-1 bg-on-surface/20 rounded-full"></div></div></main></body></html>
